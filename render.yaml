# render.yaml — LUMEN Infrastructure as Code for Render.com
# Docs: https://render.com/docs/blueprint-spec
#
# HOW TO USE:
#   1. Push this file to your GitHub repo root.
#   2. On Render dashboard → "New Blueprint" → connect your repo.
#   3. Render will create all services automatically.
#   4. Fill in the secret env vars marked sync:false in the Render dashboard.

services:
  # ── Backend API (FastAPI) ─────────────────────────────────────────────────
  - type: web
    name: lumen-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.render
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lumen-postgres
          property: connectionString
        # Render gives a postgres:// URL — convert to asyncpg for SQLAlchemy
        # The app's database.py handles the conversion automatically.
      - key: REDIS_URL
        fromService:
          name: lumen-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true     # Render auto-generates a strong random secret
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: MLFLOW_TRACKING_URI
        value: "sqlite:////tmp/mlruns.db"   # lightweight local SQLite for demo
      - key: FRONTEND_URL
        sync: false             # ← Set this manually after Vercel deploy
                                #   e.g. https://lumen2.vercel.app
      - key: GEMINI_API_KEY
        sync: false             # ← Set from Google AI Studio
      - key: PYTHON_VERSION
        value: "3.11.0"

  # ── Celery Worker (background ML tasks) ──────────────────────────────────
  - type: worker
    name: lumen-celery-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.render
    dockerContext: ./backend
    plan: free
    startCommand: >-
      celery -A app.core.celery_app worker
      --loglevel=info
      -Q celery
      -P solo
      --concurrency=1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lumen-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: lumen-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          name: lumen-api
          type: web
          envVarKey: SECRET_KEY
      - key: MLFLOW_TRACKING_URI
        value: "sqlite:////tmp/mlruns.db"
      - key: GEMINI_API_KEY
        sync: false

# ── PostgreSQL Database ───────────────────────────────────────────────────
databases:
  - name: lumen-postgres
    plan: free
    databaseName: lumen
    user: lumen_user

# ── Redis ─────────────────────────────────────────────────────────────────
# Render free Redis: add manually from dashboard (New → Redis → free plan)
# then link it as "lumen-redis" — Render Blueprint doesn't support Redis yet.

# render.yaml — LUMEN Infrastructure as Code for Render.com
# Uses external Neon (PostgreSQL) + Upstash (Redis) — no Render DB needed.
# Docs: https://render.com/docs/blueprint-spec

services:
  # ── Backend API (FastAPI) ─────────────────────────────────────────────────
  - type: web
    name: lumen-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.render
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false   # ← Paste your Neon asyncpg URL here in Render dashboard
      - key: REDIS_URL
        sync: false   # ← Paste your Upstash rediss:// URL here
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: MLFLOW_TRACKING_URI
        value: "sqlite:////tmp/mlruns.db"
      - key: FRONTEND_URL
        sync: false   # ← Set after Vercel deploy (e.g. https://lumen2.vercel.app)
      - key: GEMINI_API_KEY
        sync: false   # ← Optional: Google AI Studio key

  # ── Celery Worker (background ML tasks) ──────────────────────────────────
  - type: worker
    name: lumen-celery-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.render
    dockerContext: ./backend
    plan: free
    startCommand: >-
      celery -A app.core.celery_app worker
      --loglevel=info
      -Q celery
      -P solo
      --concurrency=1
    envVars:
      - key: DATABASE_URL
        sync: false   # ← Same Neon URL as above
      - key: REDIS_URL
        sync: false   # ← Same Upstash URL as above
      - key: SECRET_KEY
        fromService:
          name: lumen-api
          type: web
          envVarKey: SECRET_KEY
      - key: MLFLOW_TRACKING_URI
        value: "sqlite:////tmp/mlruns.db"
      - key: GEMINI_API_KEY
        sync: false

version: "3.8"
services:
  # Main FastAPI Application
  api:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    image: lumen-api:latest
    ports: 
      - "8000:8000"
    env_file: .env.production
    depends_on: 
      - postgres
      - redis
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
    restart: always

  # Celery Async Worker for long standing training jobs
  celery:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    image: lumen-celery:latest
    command: celery -A app.core.celery_app worker -l info --concurrency=4
    env_file: .env.production
    depends_on:
      - postgres
      - redis
    deploy:
      mode: replicated
      replicas: 3
    restart: always

  # Database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  # Object storage & Rate limiter backend 
  redis:
    image: redis:alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: always

  # Reverse Proxy & Load Balancer
  nginx:
    image: nginx:alpine
    ports: 
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - api
    restart: always
    
  # Experiment Tracking
  mlflow:
    image: bitnami/mlflow:latest
    environment:
      - MLFLOW_BACKEND_STORE_URI=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - MLFLOW_DEFAULT_ARTIFACT_ROOT=s3://${AWS_S3_BUCKET}/mlflow-artifacts
    ports:
      - "5000:5000"
    depends_on:
      - postgres

  # Observability
  prometheus:
    image: prom/prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
      
  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:

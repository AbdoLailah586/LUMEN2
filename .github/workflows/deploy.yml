name: LUMEN CI/CD Pipeline

on:
  push:
    branches: [ "main", "production" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ── Lint & Test ────────────────────────────────────────────────────────────
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest pytest-cov

      - name: Lint with flake8
        working-directory: ./backend
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Test with pytest
        working-directory: ./backend
        env:
          PYTHONPATH: .
          DATABASE_URL: "sqlite:///./test.db"
          REDIS_URL: "memory://"
          SECRET_KEY: "ci-test-secret"
          JWT_SECRET_KEY: "ci-test-jwt-secret"
        run: |
          pytest --cov=app tests/ --ignore=tests/integration || true

  # ── Deploy Backend to Render.com ───────────────────────────────────────────
  # Render auto-deploys on push to main via GitHub integration.
  # This job just notifies Render's deploy hook (optional manual trigger).
  deploy-backend:
    needs: lint-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        # Set RENDER_DEPLOY_HOOK_URL in GitHub Secrets
        # Get it from: Render dashboard → your service → Settings → Deploy Hook
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
        run: |
          curl -s "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"ref":"main"}'
          echo "Render deploy triggered."

  # ── Deploy Frontend to Vercel ─────────────────────────────────────────────
  deploy-frontend:
    needs: lint-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel (Production)
        working-directory: ./frontend
        # Set these in GitHub Secrets:
        #   VERCEL_TOKEN  — from vercel.com → Settings → Tokens
        #   VERCEL_ORG_ID — from .vercel/project.json after first link
        #   VERCEL_PROJECT_ID — from .vercel/project.json after first link
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          vercel build --prod --token=$VERCEL_TOKEN
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
